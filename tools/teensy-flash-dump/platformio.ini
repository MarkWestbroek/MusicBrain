; Leest het LittleFS_Program-gebied van een Teensy 4.1 uit, zonder het te
; koppelen of te beschrijven. Voor het redden van de patchbank van de losse
; 5x Elements-firmware (firmware/app-elements, 1 MB aan het eind van de flash).
; Zie README.md.
[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@5.1.0
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
upload_protocol = teensy-gui
monitor_speed = 115200
