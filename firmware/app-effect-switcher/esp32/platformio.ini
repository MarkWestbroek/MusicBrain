; PlatformIO project — MusicBrain Effect-switcher (ESP32)
;
; Default board is the very common ESP32 DevKitC (Wroom-32). Override at build
; time with `pio run -e esp32-s3` or add your own env below.
;
; Required libs are pinned to majors known to work together in Arduino-ESP32 3.x.

[platformio]
default_envs = esp32dev
src_dir       = src
data_dir      = data           ; LittleFS image source — uploaded via `pio run -t uploadfs`

[env]
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3         ; 0=none .. 5=verbose
  -DAPP_VERSION=\"0.1.0\"
  -std=gnu++17

lib_deps =
  bblanchon/ArduinoJson @ ^7.0
  ; LittleFS + WebServer are bundled in the ESP32 core, no extra deps needed.

; ─── ESP32 classic (WROOM-32) ───
[env:esp32dev]
platform = espressif32 @ ^6.6
board    = esp32dev
board_build.filesystem = littlefs
lib_extra_dirs = ../../../lib

; ─── ESP32-S3 (e.g. ESP32-S3-DevKitC-1) ───
[env:esp32-s3]
platform = espressif32 @ ^6.6
board    = esp32-s3-devkitc-1
lib_extra_dirs = ../../../lib
board_build.filesystem = littlefs

; ─── Native host build (stub-only; for unit tests later) ───
; Useful if/when we want to compile the API contract on the host for testing.
; Disabled by default since the Arduino headers aren't available natively.
