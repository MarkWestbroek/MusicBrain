; PlatformIO project — MusicBrain Effect-switcher (RP2040 / Pico W)
;
; This is the Raspberry Pi Pico W build of the effect-switcher firmware.
; It mirrors the ESP32 version but uses RP2040-specific peripherals:
;   - CYW43 WiFi (slower but functional)
;   - LittleFS on external flash (2MB total, 1MB reserved for filesystem)
;   - Hardware SPI for 74HC595 relay chain
;   - UART MIDI (31250 baud)
;   - USB MIDI device (appears as MIDI device to PC)
;
; Required libs are managed via PlatformIO Library Manager.

[platformio]
default_envs = picow
src_dir      = src
data_dir     = data           ; LittleFS image source — uploaded via `pio run -t uploadfs`

[env]
framework    = arduino
monitor_speed = 115200

build_flags =
  -DAPP_VERSION=\"0.1.0\"
  -std=gnu++17
  -DMB_LFS_SIZE=1048576       ; 1MB LittleFS partition

lib_deps =
  bblanchon/ArduinoJson @ ^7.4
  ; LittleFS is built into arduino-pico core
  ; USB MIDI is handled via arduino-pico's built-in USB stack (no MIDIUSB lib)

lib_ignore =
  tusb-midi       ; Conflicts with Adafruit_TinyUSB_Arduino (duplicate symbols)
  MIDIUSB         ; Not compatible with RP2040 arduino-pico core

; ─── Raspberry Pi Pico W ───
[env:picow]
platform   = https://github.com/maxgerhardt/platform-raspberrypi.git
board      = rpipicow
board_build.core = earlephilhower
board_build.filesystem_size = 1m
lib_ldf_mode = deep

build_flags =
  ${env.build_flags}
  -DUSE_TINYUSB=1             ; Enable TinyUSB for USB MIDI + CDC serial
  -ID:/Git/Muziek/MusicBrain/firmware/lib/midi_common  ; Include path for MidiPort.h and midi_types.h
