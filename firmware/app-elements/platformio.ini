; MusicBrain — app-elements spike target.
;
; Dedicated Teensy 4.1 app for porting Mutable Instruments *Elements* (MIT)
; modal/exciter physical-modelling synth as a `tp_mmb_elements` AudioModule.
;
; The Teensy 4.1 (Cortex-M7 @ 600 MHz + FPU) is far ahead of the original
; Elements STM32F4 (M4 @ 168 MHz), so CPU headroom is not the bottleneck.
; This target exists to measure the real per-voice cost of the ported DSP
; before integrating it into app-modular-brain as a routable module.
;
; Build : ..\..\.venv\Scripts\pio.exe run -d firmware\app-elements
; Flash : add `-t upload` (disconnect editor serial first).

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
	-D USB_MIDI_AUDIO_SERIAL
	-D TEENSY_OPT_FASTER
	-I ../core/include
	-I lib/mi-elements
lib_extra_dirs = ..
lib_deps =
	core
	mi-elements
lib_ldf_mode = deep+
upload_protocol = teensy-gui
monitor_speed = 115200
