<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MusicBrain Pad</title>
<style>
:root {
  --background: #0e1116; --surface: #151b23; --surface-2: #10151c;
  --border: #232b36; --foreground: #f2f4f8; --muted: #8c96a5;
  --accent: #f5a623; --accent-2: #3ec9d8; --status-ok: #34d399;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--background); color: var(--foreground);
  font-family: var(--font-mono);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
body {
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface);
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
}
.bar .name { color: var(--accent); font-weight: 600; }
.bar .spacer { flex: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.dot.on { background: var(--status-ok); }
.dot.off { background: var(--accent); }
.bar .cc { color: var(--muted); }

#pad { flex: 1 1 auto; display: block; width: 100%; touch-action: none; }
.mode {
  font: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--surface-2); color: var(--foreground); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px;
}
.mode.on { border-color: var(--accent); color: var(--accent); }

.legend {
  flex: 0 0 auto; display: grid; gap: 1px;
  background: var(--border); border-top: 1px solid var(--border);
}
.lrow {
  display: grid; grid-template-columns: 18px 62px 1fr auto;
  align-items: center; gap: 9px;
  padding: 7px 12px; background: var(--surface); font-size: 11px;
}
.lrow .n {
  width: 16px; height: 16px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #0e1116;
}
.lrow .ccs { color: var(--muted); font-size: 9.5px; letter-spacing: 0.06em; }
.lrow .dest { color: var(--foreground); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .vals { color: var(--accent-2); font-variant-numeric: tabular-nums; font-size: 11px; }
.lrow.idle .dest, .lrow.idle .vals { opacity: 0.42; }
</style>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span class="name" id="slotName">verbinden&hellip;</span>
  <span class="spacer"></span>
  <button class="mode" id="modeBtn" type="button">XY</button>
  <button class="mode" id="orientBtn" type="button" hidden aria-label="Richting van de schuiven">↕</button>
  <button class="mode" id="forceBtn" type="button" hidden>druk uit</button>
  <span class="cc" id="ccRange">&mdash;</span>
</div>

<canvas id="pad"></canvas>

<div class="legend" id="legend"></div>

<script type="module">
import { connect } from "/modlink.js";

// Drie aanraakpunten, elk een X- en een Y-as. Vlak n krijgt van het
// doorgeefluik een eigen CC-bereik, dus twee telefoons botsen niet.
var SLOTS = 3;
var COLORS = ["#f5a623", "#3ec9d8", "#34d399"];
var q = new URLSearchParams(location.search);

var canvas = document.getElementById("pad");
var g = canvas.getContext("2d");
var legend = document.getElementById("legend");
var dot = document.getElementById("dot");

// Elke as onthoudt zijn stand, ook na loslaten: zo laat de achtergrond zien
// waar de modulatoren nu staan in plaats van alleen tijdens het aanraken.
var slots = [];
for (var i = 0; i < SLOTS; i++) slots.push({ x: 0.5, y: 0.5, down: false, seen: false });
var labels = {};          // cc → naam van de bestemming, aangeleverd door de host
var ccBase = 0, ccCount = 0;
var pointerSlot = {};     // pointerId → index
var dirty = {};           // cc → waarde die nog verstuurd moet worden

// Optionele eigen achtergrond: pad-phone.html?bg=/iets.png
var bgImg = null;
if (q.get("bg")) {
  bgImg = new Image();
  bgImg.onerror = function () { bgImg = null; };
  bgImg.src = q.get("bg");
}

var link = connect({
  role: "surface",
  name: q.get("name") || "Telefoon",
  onWelcome: function (m) {
    ccBase = m.ccBase; ccCount = m.ccCount;
    document.getElementById("slotName").textContent = "Vlak " + m.slot;
    document.getElementById("ccRange").textContent = "CC " + m.ccBase + "–" + (m.ccBase + m.ccCount - 1);
    buildLegend();
  },
  onLabels: function (items) {
    labels = {};
    for (var i = 0; i < items.length; i++) labels[items[i].cc] = items[i].label;
    buildLegend();
    // Schuiven die nog niet bewogen zijn naar hun rust: bend in het midden.
    if (typeof faders !== "undefined") for (var j = 0; j < faders.length; j++) if (!faders[j].down && !faders[j].touched) faders[j].v = restOf(j);
  },
  onState: function (s) {
    dot.className = "dot " + (s === "verbonden" ? "on" : "off");
    if (s !== "verbonden") document.getElementById("slotName").textContent = s === "weg" ? "verbinding weg" : "verbinden…";
  }
});

function ccOf(slot, axis) { return ccBase + slot * 2 + axis; }   // axis 0 = X, 1 = Y

function buildLegend() {
  legend.innerHTML = "";
  for (var i = 0; i < SLOTS; i++) {
    var cx = ccOf(i, 0), cy = ccOf(i, 1);
    var row = document.createElement("div");
    row.className = "lrow idle";
    row.id = "lrow" + i;
    row.innerHTML =
      '<span class="n" style="background:' + COLORS[i] + '">' + (i + 1) + '</span>' +
      '<span class="ccs">CC ' + cx + "/" + cy + '</span>' +
      '<span class="dest" id="ldest' + i + '"></span>' +
      '<span class="vals" id="lval' + i + '"></span>';
    legend.appendChild(row);
  }
  paintLegend();
}

function destText(i) {
  var a = labels[ccOf(i, 0)], b = labels[ccOf(i, 1)];
  if (!a && !b) return ccBase ? "niet gekoppeld" : "—";
  return (a || "—") + "  /  " + (b || "—");
}

function paintLegend() {
  for (var i = 0; i < SLOTS; i++) {
    var row = document.getElementById("lrow" + i);
    if (!row) continue;
    row.className = "lrow" + (slots[i].seen ? "" : " idle");
    document.getElementById("ldest" + i).textContent = destText(i);
    document.getElementById("lval" + i).textContent =
      slots[i].seen ? slots[i].x.toFixed(2) + " / " + slots[i].y.toFixed(2) : "";
  }
}

function resize() {
  var r = canvas.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
else window.addEventListener("resize", resize);

function draw() {
  if (MODE === "faders") { drawFaders(); return; }
  var w = canvas.width, h = canvas.height, s = w / 400;   // schaalmaat
  g.clearRect(0, 0, w, h);

  if (bgImg && bgImg.complete && bgImg.naturalWidth) {
    g.globalAlpha = 0.35;
    g.drawImage(bgImg, 0, 0, w, h);
    g.globalAlpha = 1;
  }

  g.strokeStyle = "rgba(140,150,165,0.12)";
  g.lineWidth = 1;
  for (var i = 1; i < 8; i++) {
    var gx = Math.round(w * i / 8) + 0.5, gy = Math.round(h * i / 8) + 0.5;
    g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx, h); g.stroke();
    g.beginPath(); g.moveTo(0, gy); g.lineTo(w, gy); g.stroke();
  }

  // Asbenamingen langs de randen wijzen welke kant X en Y op lopen. Ze horen
  // bij aanraakpunt 1 en krijgen daarom diens kleur; de legenda onderaan doet
  // de andere punten, anders zou deze tekst voor alle drie lijken te gelden.
  g.font = (9 * s) + "px " + getComputedStyle(document.body).fontFamily;
  g.fillStyle = COLORS[0];
  g.globalAlpha = 0.75;
  g.textAlign = "left";  g.textBaseline = "top";
  g.fillText("1 · X → " + (labels[ccOf(0, 0)] || "vrij"), 10 * s, 9 * s);
  g.save();
  g.translate(10 * s, h - 9 * s); g.rotate(-Math.PI / 2);
  g.fillText("1 · Y → " + (labels[ccOf(0, 1)] || "vrij"), 0, 0);
  g.restore();
  g.globalAlpha = 1;

  for (var k = 0; k < SLOTS; k++) {
    var sl = slots[k];
    if (!sl.seen) continue;
    var px = sl.x * w, py = (1 - sl.y) * h;
    var col = COLORS[k];

    g.strokeStyle = col;
    g.globalAlpha = sl.down ? 0.85 : 0.3;
    g.lineWidth = Math.max(1, s);
    g.setLineDash([4 * s, 5 * s]);
    g.beginPath(); g.moveTo(px, 0); g.lineTo(px, h); g.stroke();
    g.beginPath(); g.moveTo(0, py); g.lineTo(w, py); g.stroke();
    g.setLineDash([]);

    g.globalAlpha = sl.down ? 0.22 : 0.1;
    g.fillStyle = col;
    g.beginPath(); g.arc(px, py, (sl.down ? 26 : 14) * s, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    g.beginPath(); g.arc(px, py, 5 * s, 0, Math.PI * 2); g.fill();

    g.fillStyle = col;
    g.font = (10 * s) + "px " + getComputedStyle(document.body).fontFamily;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(k + 1), px, py - 15 * s);
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillText(sl.x.toFixed(2) + " / " + sl.y.toFixed(2), px + 10 * s, py + 8 * s);
  }
  g.globalAlpha = 1;
}

// Waarden ophopen en één keer per beeld versturen: een vinger levert veel
// meer punten dan zestig per seconde, en die hoeven niet allemaal over de lijn.
function flush() {
  for (var cc in dirty) if (Object.prototype.hasOwnProperty.call(dirty, cc)) link.sendValue(+cc, dirty[cc]);
  dirty = {};
  paintLegend();
  draw();
  requestAnimationFrame(flush);
}

function place(idx, e) {
  var r = canvas.getBoundingClientRect();
  var x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  var y = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
  var sl = slots[idx];
  sl.x = x; sl.y = y; sl.seen = true;
  dirty[ccOf(idx, 0)] = x;
  dirty[ccOf(idx, 1)] = y;
}

function freeSlot() {
  for (var i = 0; i < SLOTS; i++) if (!slots[i].down) return i;
  return -1;
}

canvas.addEventListener("pointerdown", function (e) {
  if (MODE === "faders") { faderDown(e); return; }
  var idx = freeSlot();
  if (idx < 0) return;
  pointerSlot[e.pointerId] = idx;
  slots[idx].down = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* niet nodig */ }
  place(idx, e);
  e.preventDefault();
});
canvas.addEventListener("pointermove", function (e) {
  if (MODE === "faders") { faderMove(e); return; }
  var idx = pointerSlot[e.pointerId];
  if (idx === undefined) return;
  place(idx, e);
  e.preventDefault();
});
function lift(e) {
  if (MODE === "faders") { faderLift(e); return; }
  var idx = pointerSlot[e.pointerId];
  if (idx === undefined) return;
  slots[idx].down = false;          // waarde blijft staan: modulatoren houden vast
  delete pointerSlot[e.pointerId];
  // Loslaten melden (up), zodat een host kan terugveren (aftertouch, bend).
  // Eerst wat nog wacht wegstrepen, anders komt er na de up nog een waarde.
  var cx = ccOf(idx, 0), cy = ccOf(idx, 1);
  delete dirty[cx]; delete dirty[cy];
  link.sendValue(cx, slots[idx].x, { up: true });
  link.sendValue(cy, slots[idx].y, { up: true });
}
canvas.addEventListener("pointerup", lift);
canvas.addEventListener("pointercancel", lift);

// iOS zoomt anders op een dubbeltik midden in een beweging.
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
document.addEventListener("dblclick", function (e) { e.preventDefault(); });

// Het scherm mag niet uitgaan terwijl je speelt.
if (navigator.wakeLock) {
  var relock = function () {
    if (document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () { /* mag falen */ });
  };
  relock();
  document.addEventListener("visibilitychange", relock);
}

// ── Faderstand ─────────────────────────────────────────────────────────
// Zes verticale schuiven naast elkaar, elk één as (CC ccBase+i), met
// meerdere vingers tegelijk. Natuurlijker dan X en Y van één punt tegelijk.
// Met "druk" aan komt de waarde uit de aanraakdruk: echte druk als het
// toestel die meldt, anders hoe plat de vingertop wordt (contactvlak).
var MODE = localStorage.getItem("pad.mode") === "faders" ? "faders" : "xy";
var useForce = localStorage.getItem("pad.force") === "1";
// ↕ staand (naast elkaar, omhoog = meer) of ↔ liggend (onder elkaar, rechts = meer).
var ORIENT = localStorage.getItem("pad.orient") === "h" ? "h" : "v";
var FADERS = 6;
var faders = [];
for (var fi = 0; fi < FADERS; fi++) faders.push({ v: 0, down: false, pid: null, base: 0, raw: "" });
var forceInfo = "";

function restOf(i) { return /Pitch bend/.test(labels[ccBase + i] || "") ? 0.5 : 0; }
function springs(i) { return /↺/.test(labels[ccBase + i] || ""); }

function forceValue(e, fd) {
  // Echte druk: telt alleen als hij beweegt (veel toestellen melden vast 0,5 of 1).
  var p = typeof e.pressure === "number" ? e.pressure : 0;
  var size = Math.max(e.width || 0, e.height || 0);
  if (fd.pmin === undefined) { fd.pmin = p; fd.pmax = p; }
  fd.pmin = Math.min(fd.pmin, p); fd.pmax = Math.max(fd.pmax, p);
  var real = fd.pmax - fd.pmin > 0.05 && p > 0 && p < 1;
  forceInfo = "druk " + p.toFixed(2) + (real ? " (echt)" : " (vast)") + " · vlak " + size.toFixed(0) + "px";
  if (real) return Math.max(0, Math.min(1, p));
  if (!size) return fd.v;
  if (!fd.base) fd.base = size;
  // Vingertop ~60% groter bij flink drukken ≈ vol.
  return Math.max(0, Math.min(1, (size - fd.base) / (fd.base * 0.6)));
}

function faderAt(e) {
  var r = canvas.getBoundingClientRect();
  var t = ORIENT === "h" ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  return Math.max(0, Math.min(FADERS - 1, Math.floor(t * FADERS)));
}
function faderSet(i, e) {
  var r = canvas.getBoundingClientRect(), fd = faders[i];
  var pos = ORIENT === "h" ? (e.clientX - r.left) / r.width : 1 - (e.clientY - r.top) / r.height;
  fd.v = useForce ? forceValue(e, fd) : Math.max(0, Math.min(1, pos));
  dirty[ccBase + i] = fd.v;
}
function faderDown(e) {
  var i = faderAt(e), fd = faders[i];
  if (fd.down) return;                         // één vinger per fader
  fd.down = true; fd.pid = e.pointerId; fd.base = 0; fd.pmin = undefined; fd.pmax = undefined;
  fd.touched = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* niet nodig */ }
  faderSet(i, e);
  e.preventDefault();
}
function faderMove(e) {
  for (var i = 0; i < FADERS; i++) if (faders[i].pid === e.pointerId) { faderSet(i, e); e.preventDefault(); return; }
}
function faderLift(e) {
  for (var i = 0; i < FADERS; i++) {
    var fd = faders[i];
    if (fd.pid !== e.pointerId) continue;
    fd.down = false; fd.pid = null;
    delete dirty[ccBase + i];
    link.sendValue(ccBase + i, fd.v, { up: true });
    if (springs(i)) fd.v = restOf(i);        // de host veert terug; de schuif ook
  }
}

function drawFaders() {
  var w = canvas.width, h = canvas.height, s = w / 400;
  var font = getComputedStyle(document.body).fontFamily;
  g.clearRect(0, 0, w, h);
  var horiz = ORIENT === "h";
  for (var i = 0; i < FADERS; i++) {
    var fd = faders[i], col = COLORS[Math.floor(i / 2) % COLORS.length];
    var rest = restOf(i);
    var lab = labels[ccBase + i] || ("CC " + (ccBase + i));
    var words = lab.replace(/\s*\(CC (\d+)\)/, "|CC $1").split("|");
    if (horiz) {
      // Rijen: label links, schuif rechts, waarde rechts erin.
      var rowH = h / FADERS, p = 4 * s, y0 = i * rowH + p, rh = rowH - 2 * p;
      var labW = 92 * s, x0 = labW, x1 = w - 6 * s;
      g.fillStyle = "#151b23"; g.fillRect(x0, y0, x1 - x0, rh);
      var xv = x0 + fd.v * (x1 - x0), xr = x0 + rest * (x1 - x0);
      g.globalAlpha = fd.down ? 0.9 : 0.55; g.fillStyle = col;
      g.fillRect(Math.min(xv, xr), y0, Math.max(2 * s, Math.abs(xv - xr)), rh);
      g.globalAlpha = 1;
      g.textAlign = "left"; g.textBaseline = "middle";
      g.fillStyle = "#f2f4f8"; g.font = (10 * s) + "px " + font;
      g.fillText(words[0], 6 * s, y0 + rh / 2 - (words[1] ? 6 * s : 0), labW - 10 * s);
      if (words[1]) { g.fillStyle = "#8c96a5"; g.font = (8 * s) + "px " + font; g.fillText(words[1], 6 * s, y0 + rh / 2 + 7 * s, labW - 10 * s); }
      g.fillStyle = "#f2f4f8"; g.font = (10 * s) + "px " + font; g.textAlign = "right";
      g.fillText(fd.v.toFixed(2), x1 - 6 * s, y0 + rh / 2);
    } else {
      // Kolommen: waarde boven, schuif in het midden, label onder.
      var colW = w / FADERS, pad = 4 * s, top = 22 * s, bottom = h - 34 * s, x0c = i * colW + pad, cw = colW - 2 * pad;
      g.fillStyle = "#151b23"; g.fillRect(x0c, top, cw, bottom - top);
      var yv = bottom - fd.v * (bottom - top), yr = bottom - rest * (bottom - top);
      g.globalAlpha = fd.down ? 0.9 : 0.55; g.fillStyle = col;
      g.fillRect(x0c, Math.min(yv, yr), cw, Math.max(2 * s, Math.abs(yr - yv)));
      g.globalAlpha = 1;
      g.fillStyle = "#f2f4f8"; g.font = (10 * s) + "px " + font; g.textAlign = "center"; g.textBaseline = "top";
      g.fillText(fd.v.toFixed(2), x0c + cw / 2, 5 * s);
      g.fillStyle = "#8c96a5"; g.font = (8 * s) + "px " + font;
      g.fillText(words[0], x0c + cw / 2, bottom + 5 * s, cw);
      if (words[1]) g.fillText(words[1], x0c + cw / 2, bottom + 17 * s, cw);
    }
  }
  if (useForce && forceInfo) {
    g.fillStyle = "#3ec9d8"; g.font = (9 * s) + "px " + font; g.textAlign = "left"; g.textBaseline = "top";
    g.fillText(forceInfo, 6 * s, 4 * s);
  }
}

function applyMode() {
  var mb = document.getElementById("modeBtn"), fb = document.getElementById("forceBtn");
  mb.textContent = MODE === "faders" ? "faders" : "XY";
  fb.hidden = MODE !== "faders";
  var ob = document.getElementById("orientBtn");
  ob.hidden = MODE !== "faders";
  ob.textContent = ORIENT === "h" ? "↔" : "↕";
  fb.textContent = useForce ? "druk aan" : "druk uit";
  fb.className = "mode" + (useForce ? " on" : "");
  legend.style.display = MODE === "faders" ? "none" : "";
}
document.getElementById("modeBtn").addEventListener("click", function () {
  MODE = MODE === "faders" ? "xy" : "faders";
  try { localStorage.setItem("pad.mode", MODE); } catch (err) { /* geen opslag */ }
  applyMode();
});
document.getElementById("orientBtn").addEventListener("click", function () {
  ORIENT = ORIENT === "h" ? "v" : "h";
  try { localStorage.setItem("pad.orient", ORIENT); } catch (err) { /* geen opslag */ }
  applyMode();
});
document.getElementById("forceBtn").addEventListener("click", function () {
  useForce = !useForce; forceInfo = "";
  try { localStorage.setItem("pad.force", useForce ? "1" : "0"); } catch (err) { /* geen opslag */ }
  applyMode();
});
applyMode();

buildLegend();
resize();
flush();
</script>
